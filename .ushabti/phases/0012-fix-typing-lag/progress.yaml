phase:
  id: 0012
  slug: fix-typing-lag
  title: Fix Typing Lag in Card Editor
  status: complete

steps:
  - id: S001
    title: Investigate and Document Root Cause
    implemented: true
    reviewed: true
    notes: |
      Confirmed root cause: every keystroke in CardBodyEditor triggers synchronous disk write on main thread.

      Call chain:
      1. User types in CardBodyEditor (CodeEditor)
      2. CardBodyEditor.contentBinding setter is called (line 70)
      3. Binding calls onUpdate() callback (line 71)
      4. onUpdate points to CardDetail.saveCard() (line 27)
      5. saveCard() calls viewModel.updateCard(editableCard) (line 89)
      6. HieroglyphsVM.updateCard() writes to disk via workspaceService.updateCard() (line 214)
      7. HieroglyphsVM.updateCard() calls loadCards() to reload all cards (line 215)
      8. loadCards() reads all cards from disk via workspaceService.loadCards() (line 142-145)

      Same pattern occurs in CardMetadataEditor.titleBinding (line 90).

      Picker changes (type, status, priority) and tag operations also use immediate writes, which is correct behavior for discrete actions.

      Problem: Steps 6-8 are synchronous file I/O on main thread, blocking UI on every keystroke.
    touched: []

  - id: S002
    title: Add Debouncer Utility
    implemented: true
    reviewed: true
    notes: |
      Created Debouncer utility in Sources/Hieroglyphs/Utilities/Debouncer.swift.

      Public API:
      - init(delay: TimeInterval) - creates debouncer with specified delay
      - schedule(action:) - schedules action to run after delay, canceling previous
      - flush() - executes pending action immediately, bypassing delay
      - cancel() - cancels pending action without executing

      Implementation uses Swift Concurrency (Task with sleep) for main-thread-safe debouncing.
      Stores pending action in private property to enable flush() to execute immediately.
      Automatically cancels on deinit for cleanup.
    touched:
      - Sources/Hieroglyphs/Utilities/Debouncer.swift

  - id: S003
    title: Add Tests for Debouncer
    implemented: true
    reviewed: true
    notes: |
      Created comprehensive tests in Tests/HieroglyphsTests/DebouncerTests.swift.

      Test coverage:
      - testScheduledActionExecutesAfterDelay - verifies delay behavior
      - testMultipleSchedulesCoalesceToSingleExecution - verifies coalescing
      - testFlushExecutesActionImmediately - verifies immediate flush
      - testCancelPreventsExecution - verifies cancel behavior
      - testFlushWithNoPendingActionDoesNothing - verifies safe empty flush
      - testCancelWithNoPendingActionDoesNothing - verifies safe empty cancel
      - testRapidScheduleAndFlush - verifies flush executes most recent action

      All 7 tests pass. Fixed deinit isolation issue using nonisolated deinit.
    touched:
      - Tests/HieroglyphsTests/DebouncerTests.swift
      - Sources/Hieroglyphs/Utilities/Debouncer.swift

  - id: S004
    title: Add Debounced Save to HieroglyphsVM
    implemented: true
    reviewed: true
    notes: |
      Added debouncing capability to HieroglyphsVM.

      Changes:
      - Added private cardUpdateDebouncer: Debouncer (1.5 second delay)
      - Added private pendingCardUpdate: Card? to store pending update
      - Added updateCardDebounced(_:) method for debounced writes
      - Added flushPendingCardUpdates() method to force immediate write
      - Kept existing updateCard(_:) method for immediate writes (pickers, tags)

      Debouncer is initialized with 1.5s delay. Pending card stored in property
      to pass to debouncer action closure. Flush method triggers immediate write.
    touched:
      - Sources/Hieroglyphs/HieroglyphsVM.swift

  - id: S005
    title: Update CardBodyEditor to Use Debounced Saves
    implemented: true
    reviewed: true
    notes: |
      Updated CardDetail to support debounced saves.

      Changes:
      - Modified saveCard() to accept debounced: Bool parameter (default false)
      - Updated CardBodyEditor onUpdate callback to pass debounced: true
      - saveCard() now calls viewModel.updateCardDebounced() when debounced=true
      - saveCard() calls viewModel.updateCard() when debounced=false (immediate)

      CardBodyEditor now uses debounced writes. Typing in body editor schedules
      write after 1.5s delay instead of writing on every keystroke.
    touched:
      - Sources/Hieroglyphs/Views/CardDetail/CardDetail.swift

  - id: S006
    title: Update CardMetadataEditor Title Field to Use Debounced Saves
    implemented: true
    reviewed: true
    notes: |
      Updated CardMetadataEditor to distinguish debounced vs immediate saves.

      Changes:
      - Changed onUpdate callback signature from () -> Void to (Bool) -> Void
      - titleBinding calls onUpdate(true) for debounced save
      - typeBinding, statusBinding, priorityBinding call onUpdate(false) for immediate
      - addTag() and removeTag() call onUpdate(false) for immediate
      - Updated documentation to reflect debounced title vs immediate pickers/tags

      Title field now uses debounced writes (1.5s delay). Pickers and tags use
      immediate writes as they are discrete actions.
    touched:
      - Sources/Hieroglyphs/Views/CardDetail/CardMetadataEditor.swift

  - id: S007
    title: Flush Pending Writes on Card Deselection
    implemented: true
    reviewed: true
    notes: |
      Added flush on card deselection in CardDetail.

      Changes:
      - Updated .onChange(of: viewModel.selectedCard) to call flushPendingCardUpdates()
      - Flush happens before editableCard is updated to new selection
      - Ensures pending writes complete before loading new card

      When user selects different card, any pending debounced writes are flushed
      immediately to disk, preventing data loss when switching cards rapidly.
    touched:
      - Sources/Hieroglyphs/Views/CardDetail/CardDetail.swift

  - id: S008
    title: Flush Pending Writes on App Termination
    implemented: true
    reviewed: true
    notes: |
      Added app termination handler in App.swift.

      Changes:
      - Added .onReceive(NotificationCenter.default.publisher(for: NSApplication.willTerminateNotification))
      - Handler calls viewModel.flushPendingCardUpdates() on termination
      - Attached to Group containing MainWindow/WelcomeView

      When user quits app (Cmd+Q or Quit menu), pending debounced writes are
      flushed immediately before app terminates, ensuring no data loss.
    touched:
      - Sources/Hieroglyphs/App.swift

  - id: S009
    title: Prevent File Watcher from Reloading Edited Card
    implemented: true
    reviewed: true
    notes: |
      Added file watcher guard to prevent reloading currently edited card.

      Changes:
      - Added private lastDebouncedWritePath: String? to track self-writes
      - updateCardDebounced() sets lastDebouncedWritePath before writing
      - updateCard() clears lastDebouncedWritePath after immediate writes
      - handleFileChange() checks if path matches lastDebouncedWritePath
      - If match, skips loadCards() but still reconciles tags
      - Clears lastDebouncedWritePath after handling

      When debounced write triggers file watcher, the watch handler recognizes
      it as a self-write and skips reloading cards. External edits still trigger
      reload as expected. Prevents card flicker during typing.
    touched:
      - Sources/Hieroglyphs/HieroglyphsVM.swift

