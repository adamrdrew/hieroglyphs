      - testFlushPendingCardUpdatesExecutesImmediately - verifies flush executes immediately

      Both tests use MockWorkspaceService to verify service call count and timing.
      Tests confirm debouncing delays write and flush forces immediate execution.
      All tests pass.
    touched:
